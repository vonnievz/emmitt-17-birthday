<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 17th Birthday, Emmitt!</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #08111f;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
  color: white;
}

/* =========================
   MAIN BIRTHDAY SCENE
========================= */

.hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background:
    radial-gradient(circle at top, #173761, #07111f 70%);
}

.hero-image {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 1100px;
  height: auto;
  display: block;
  box-shadow:
    0 0 45px rgba(0,0,0,.45);
}

/* =========================
   INTRO SCREEN
========================= */

.intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;

  background:
    radial-gradient(circle at 50% 35%, #1887ef 0%, #075abf 45%, #042857 100%);

  transition:
    opacity .7s ease,
    visibility .7s ease;
}

.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-card {
  width: min(92vw, 560px);
  text-align: center;
}

.intro-brick {
  width: 90px;
  height: 52px;
  margin: 0 auto 28px;
  position: relative;

  background: #e72b31;

  border: 5px solid #111;
  border-radius: 7px;

  box-shadow:
    inset -8px -8px 0 rgba(0,0,0,.14),
    0 8px 0 #111;
}

.intro-brick::before {
  content: "";
  position: absolute;

  width: 26px;
  height: 13px;

  top: -14px;
  left: 10px;

  border: 4px solid #111;
  border-radius: 50%;

  background: #f4474c;

  box-shadow:
    36px 0 0 #f4474c,
    36px 0 0 0 #f4474c;
}

.intro h1 {
  margin: 0;

  font-size: clamp(48px, 11vw, 95px);
  line-height: .9;
  letter-spacing: -3px;

  text-transform: uppercase;

  text-shadow:
    4px 4px 0 #111,
    8px 8px 0 rgba(0,0,0,.2);
}

.intro h1 span {
  color: #ffd51b;
}

.level {
  display: inline-block;

  margin-top: 24px;
  padding: 11px 18px;

  background: #ffd51b;
  color: #111;

  border: 4px solid #111;
  border-radius: 12px;

  font-size: clamp(16px, 4vw, 22px);
  font-weight: 900;

  box-shadow: 5px 5px 0 #111;
}

.tap-btn {
  display: block;

  margin: 35px auto 0;
  padding: 17px 29px;

  border: 5px solid #111;
  border-radius: 16px;

  background:
    linear-gradient(#ed3d42, #c71d25);

  color: white;

  font-size: clamp(17px, 4vw, 22px);
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 7px 0 #111,
    0 14px 25px rgba(0,0,0,.25);

  transition: .12s ease;
}

.tap-btn:hover {
  transform: translateY(-3px);
}

.tap-btn:active {
  transform: translateY(5px);
  box-shadow:
    0 2px 0 #111;
}

/* =========================
   BUILD AGAIN BUTTON
========================= */

.build-btn {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  z-index: 25;

  padding: 14px 24px;

  border: 4px solid #111;
  border-radius: 18px;

  background:
    linear-gradient(#2085f0, #0759c8);

  color: white;

  font-size: 17px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 7px 0 #111,
    0 12px 25px rgba(0,0,0,.38);

  transition: .12s ease;
}

.build-btn:hover {
  transform:
    translateX(-50%)
    translateY(-3px);
}

.build-btn:active {
  transform:
    translateX(-50%)
    translateY(4px);

  box-shadow:
    0 2px 0 #111;
}

/* =========================
   EFFECT LAYER
========================= */

#effects {
  position: fixed;
  inset: 0;

  z-index: 50;

  pointer-events: none;
  overflow: hidden;
}

/* =========================
   BETTER BRICK SHAPES
========================= */

.brick {
  position: absolute;

  top: -120px;

  width: 64px;
  height: 36px;

  border: 4px solid #111;
  border-radius: 6px;

  background: var(--brick);

  box-shadow:
    inset -8px -8px 0 rgba(0,0,0,.16),
    inset 5px 5px 0 rgba(255,255,255,.18),
    0 8px 8px rgba(0,0,0,.18);

  animation:
    brickFall linear forwards;
}

/* top studs */

.brick::before {
  content: "";

  position: absolute;

  width: 17px;
  height: 9px;

  left: 7px;
  top: -11px;

  border: 3px solid #111;
  border-radius: 50%;

  background: var(--brick);

  box-shadow:
    27px 0 0 var(--brick);
}

/* side depth */

.brick::after {
  content: "";

  position: absolute;

  width: 10px;
  height: 25px;

  right: -10px;
  bottom: -3px;

  background:
    color-mix(in srgb, var(--brick) 72%, black);

  border-right: 4px solid #111;
  border-bottom: 4px solid #111;

  transform: skewY(-28deg);

  transform-origin: left top;
}

/* longer 2x4 brick */

.brick.long {
  width: 90px;
}

.brick.long::before {
  box-shadow:
    22px 0 0 var(--brick),
    44px 0 0 var(--brick),
    66px 0 0 var(--brick);
}

.brick.long::after {
  height: 25px;
}

/* square brick */

.brick.square {
  width: 48px;
  height: 48px;
}

.brick.square::before {
  left: 5px;

  box-shadow:
    20px 0 0 var(--brick),
    0 20px 0 var(--brick),
    20px 20px 0 var(--brick);
}

@keyframes brickFall {

  from {
    transform:
      translateY(-140px)
      rotate(0deg);
  }

  to {
    transform:
      translateY(120vh)
      rotate(620deg);
  }

}

/* =========================
   CONFETTI
========================= */

.confetti {
  position: absolute;

  top: -40px;

  width: 10px;
  height: 22px;

  border-radius: 2px;

  animation:
    confettiFall linear forwards;
}

@keyframes confettiFall {

  from {
    transform:
      translateY(-40px)
      rotate(0deg);
  }

  to {
    transform:
      translateY(115vh)
      rotate(900deg);
  }

}

/* =========================
   STARS
========================= */

.star {
  position: absolute;

  top: -50px;

  font-size: 28px;

  animation:
    starFall linear forwards;
}

@keyframes starFall {

  from {
    transform:
      translateY(-60px)
      rotate(0deg)
      scale(.6);

    opacity: 1;
  }

  to {
    transform:
      translateY(105vh)
      rotate(500deg)
      scale(1.3);

    opacity: .7;
  }

}

/* =========================
   FLASH MESSAGE
========================= */

.build-message {
  position: fixed;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    scale(.8);

  z-index: 70;

  background:
    linear-gradient(#ffd92a, #efb900);

  color: #111;

  border: 5px solid #111;
  border-radius: 16px;

  padding: 18px 26px;

  font-size: clamp(25px, 7vw, 52px);
  font-weight: 1000;

  text-align: center;

  box-shadow:
    8px 8px 0 #111;

  opacity: 0;

  pointer-events: none;
}

.build-message.show {
  animation:
    popMessage 1.2s ease forwards;
}

@keyframes popMessage {

  0% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(.5)
      rotate(-5deg);
  }

  20% {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1.08)
      rotate(2deg);
  }

  70% {
    opacity: 1;
    transform:
      translate(-50%, -50%)
      scale(1);
  }

  100% {
    opacity: 0;
    transform:
      translate(-50%, -50%)
      scale(.95);
  }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .hero-image {
    width: 100%;
  }

  .build-btn {
    bottom: 12px;

    font-size: 14px;

    padding: 11px 17px;
  }

  .brick {
    transform-origin: center;
  }

}

</style>
</head>

<body>

<!-- OPENING SCREEN -->

<div class="intro" id="intro">

  <div class="intro-card">

    <div class="intro-brick"></div>

    <h1>
      EMMITT'S
      <br>
      <span>17TH</span>
    </h1>

    <div class="level">
      🏆 MASTER BUILDER LEVEL 17
    </div>

    <button
      class="tap-btn"
      onclick="startCard()"
    >
      🧱 TAP TO BUILD
    </button>

  </div>

</div>


<!-- EFFECTS -->

<div id="effects"></div>


<!-- BUILD MESSAGE -->

<div
  class="build-message"
  id="buildMessage"
>
  LEVEL 17 UNLOCKED!
</div>


<!-- MAIN IMAGE -->

<main class="hero">

  <img
    src="emmitt-birthday-hero.png"
    alt="Happy 17th Birthday Emmitt"
    class="hero-image"
  >

</main>


<!-- BUILD AGAIN -->

<button
  class="build-btn"
  onclick="megaBuild()"
>
  🧱 BUILD AGAIN
</button>


<script>

/* =========================
   COLORS
========================= */

const colors = [
  "#e72b31",
  "#ffd51b",
  "#086dd7",
  "#159549",
  "#f28a20",
  "#ffffff"
];


/* =========================
   MAKE ONE BRICK
========================= */

function makeBrick() {

  const effects =
    document.getElementById("effects");

  const brick =
    document.createElement("div");

  brick.className = "brick";

  const shape =
    Math.random();

  if (shape > .66) {
    brick.classList.add("long");
  }
  else if (shape < .23) {
    brick.classList.add("square");
  }

  const color =
    colors[
      Math.floor(
        Math.random() * colors.length
      )
    ];

  brick.style.setProperty(
    "--brick",
    color
  );

  brick.style.left =
    Math.random() * 95 + "vw";

  brick.style.animationDuration =
    2.4 +
    Math.random() * 2.4 +
    "s";

  brick.style.animationDelay =
    Math.random() * .35 +
    "s";

  const size =
    .65 +
    Math.random() * .75;

  brick.style.scale =
    size;

  effects.appendChild(brick);

  setTimeout(() => {

    brick.remove();

  }, 6000);

}


/* =========================
   CONFETTI
========================= */

function makeConfetti() {

  const effects =
    document.getElementById("effects");

  const piece =
    document.createElement("div");

  piece.className =
    "confetti";

  piece.style.left =
    Math.random() * 100 +
    "vw";

  piece.style.background =
    colors[
      Math.floor(
        Math.random() * colors.length
      )
    ];

  piece.style.animationDuration =
    2 +
    Math.random() * 2.5 +
    "s";

  piece.style.animationDelay =
    Math.random() * .25 +
    "s";

  effects.appendChild(piece);

  setTimeout(() => {

    piece.remove();

  }, 5500);

}


/* =========================
   STAR
========================= */

function makeStar() {

  const effects =
    document.getElementById("effects");

  const star =
    document.createElement("div");

  star.className =
    "star";

  star.innerHTML =
    Math.random() > .5
      ? "⭐"
      : "✨";

  star.style.left =
    Math.random() * 95 +
    "vw";

  star.style.animationDuration =
    2.6 +
    Math.random() * 2 +
    "s";

  effects.appendChild(star);

  setTimeout(() => {

    star.remove();

  }, 5500);

}


/* =========================
   BUILD CELEBRATION
========================= */

function megaBuild() {

  for (
    let i = 0;
    i < 24;
    i++
  ) {

    setTimeout(() => {

      makeBrick();

    }, i * 70);

  }


  for (
    let i = 0;
    i < 40;
    i++
  ) {

    setTimeout(() => {

      makeConfetti();

    }, i * 35);

  }


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    setTimeout(() => {

      makeStar();

    }, i * 140);

  }


  const message =
    document.getElementById(
      "buildMessage"
    );

  message.classList.remove(
    "show"
  );

  void message.offsetWidth;

  message.classList.add(
    "show"
  );

}


/* =========================
   START CARD
========================= */

function startCard() {

  document
    .getElementById("intro")
    .classList.add("hide");

  setTimeout(() => {

    megaBuild();

  }, 350);

}

</script>

</body>
</html>
