<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 17th Birthday, Emmitt!</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #08111f;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
  color: white;
}

/* MAIN SCENE */

.hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;

  background:
    radial-gradient(circle at top, #173761, #07111f 70%);
}

.hero-image {
  width: 100%;
  max-width: 1100px;
  height: auto;
  display: block;

  box-shadow:
    0 0 45px rgba(0,0,0,.45);
}

/* OPENING SCREEN */

.intro {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background:
    radial-gradient(circle at 50% 35%, #1887ef 0%, #075abf 45%, #042857 100%);

  transition:
    opacity .7s ease,
    visibility .7s ease;
}

.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-card {
  width: min(92vw, 560px);
  text-align: center;
}

.intro-brick {
  width: 90px;
  height: 52px;
  margin: 0 auto 28px;

  position: relative;

  background: #e72b31;

  border: 5px solid #111;
  border-radius: 7px;

  box-shadow:
    inset -8px -8px 0 rgba(0,0,0,.14),
    0 8px 0 #111;
}

.intro-brick::before {
  content: "";

  position: absolute;

  width: 26px;
  height: 13px;

  top: -14px;
  left: 10px;

  border: 4px solid #111;
  border-radius: 50%;

  background: #f4474c;

  box-shadow:
    36px 0 0 #f4474c;
}

.intro h1 {
  margin: 0;

  font-size: clamp(48px, 11vw, 95px);
  line-height: .9;
  letter-spacing: -3px;

  text-transform: uppercase;

  text-shadow:
    4px 4px 0 #111,
    8px 8px 0 rgba(0,0,0,.2);
}

.intro h1 span {
  color: #ffd51b;
}

.level {
  display: inline-block;

  margin-top: 24px;
  padding: 11px 18px;

  background: #ffd51b;
  color: #111;

  border: 4px solid #111;
  border-radius: 12px;

  font-size: clamp(16px, 4vw, 22px);
  font-weight: 900;

  box-shadow: 5px 5px 0 #111;
}

.tap-btn {
  display: block;

  margin: 35px auto 0;
  padding: 17px 29px;

  border: 5px solid #111;
  border-radius: 16px;

  background:
    linear-gradient(#ed3d42, #c71d25);

  color: white;

  font-size: clamp(17px, 4vw, 22px);
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 7px 0 #111,
    0 14px 25px rgba(0,0,0,.25);
}

/* BUILD AGAIN BUTTON */

.build-btn {
  position: fixed;

  left: 50%;
  bottom: 18px;

  transform: translateX(-50%);

  z-index: 30;

  padding: 14px 24px;

  border: 4px solid #111;
  border-radius: 18px;

  background:
    linear-gradient(#2085f0, #0759c8);

  color: white;

  font-size: 17px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 7px 0 #111,
    0 12px 25px rgba(0,0,0,.38);
}

.build-btn:hover {
  transform:
    translateX(-50%)
    translateY(-3px);
}

.build-btn:active {
  transform:
    translateX(-50%)
    translateY(4px);

  box-shadow:
    0 2px 0 #111;
}

/* EFFECTS LAYER */

#effects {
  position: fixed;
  inset: 0;

  z-index: 50;

  pointer-events: none;
  overflow: hidden;
}

/* CONFETTI */

.confetti {
  position: absolute;

  top: -30px;

  width: 8px;
  height: 18px;

  border-radius: 2px;

  animation:
    confettiFall linear forwards;
}

@keyframes confettiFall {
  from {
    transform:
      translateY(-40px)
      rotate(0deg);

    opacity: 1;
  }

  to {
    transform:
      translateY(105vh)
      rotate(720deg);

    opacity: .85;
  }
}

/* SPARKLES */

.sparkle {
  position: absolute;

  top: -40px;

  font-size: 18px;

  animation:
    sparkleFall linear forwards;
}

@keyframes sparkleFall {
  from {
    transform:
      translateY(-40px)
      rotate(0deg)
      scale(.7);

    opacity: 1;
  }

  to {
    transform:
      translateY(100vh)
      rotate(420deg)
      scale(1.1);

    opacity: .2;
  }
}

/* LEVEL MESSAGE */

.build-message {
  position: fixed;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    scale(.8);

  z-index: 70;

  background:
    linear-gradient(#ffd92a, #efb900);

  color: #111;

  border: 5px solid #111;
  border-radius: 16px;

  padding: 18px 26px;

  font-size: clamp(24px, 7vw, 50px);
  font-weight: 1000;

  text-align: center;

  box-shadow:
    8px 8px 0 #111;

  opacity: 0;

  pointer-events: none;
}

.build-message.show {
  animation:
    popMessage 1.15s ease forwards;
}

@keyframes popMessage {
  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(.5)
      rotate(-4deg);
  }

  20% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1.07)
      rotate(1deg);
  }

  70% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(.95);
  }
}

/* MOBILE */

@media (max-width: 600px) {
  .build-btn {
    font-size: 14px;
    padding: 11px 17px;
    bottom: 12px;
  }
}
</style>
</head>

<body>

<!-- OPENING SCREEN -->

<div class="intro" id="intro">

  <div class="intro-card">

    <div class="intro-brick"></div>

    <h1>
      EMMITT'S
      <br>
      <span>17TH</span>
    </h1>

    <div class="level">
      🏆 MASTER BUILDER LEVEL 17
    </div>

    <button
      class="tap-btn"
      onclick="startCard()"
    >
      🧱 TAP TO BUILD
    </button>

  </div>

</div>


<!-- EFFECTS -->

<div id="effects"></div>


<!-- LEVEL MESSAGE -->

<div
  class="build-message"
  id="buildMessage"
>
  LEVEL 17 UNLOCKED!
</div>


<!-- MAIN ARTWORK -->

<main class="hero">

  <img
    src="emmitt-birthday-hero.png"
    alt="Happy 17th Birthday Emmitt"
    class="hero-image"
  >

</main>


<!-- BUILD AGAIN -->

<button
  class="build-btn"
  onclick="celebrate()"
>
  ✨ BUILD AGAIN
</button>


<script>

const colors = [
  "#e72b31",
  "#ffd51b",
  "#086dd7",
  "#159549",
  "#f28a20",
  "#ffffff"
];


/* CONFETTI */

function makeConfetti() {

  const effects =
    document.getElementById("effects");

  const piece =
    document.createElement("div");

  piece.className =
    "confetti";

  piece.style.left =
    Math.random() * 100 +
    "vw";

  piece.style.background =
    colors[
      Math.floor(
        Math.random() * colors.length
      )
    ];

  piece.style.animationDuration =
    2.2 +
    Math.random() * 2 +
    "s";

  piece.style.animationDelay =
    Math.random() * .25 +
    "s";

  effects.appendChild(piece);

  setTimeout(() => {
    piece.remove();
  }, 5000);
}


/* SPARKLES */

function makeSparkle() {

  const effects =
    document.getElementById("effects");

  const sparkle =
    document.createElement("div");

  sparkle.className =
    "sparkle";

  sparkle.textContent =
    Math.random() > .5
      ? "✨"
      : "⭐";

  sparkle.style.left =
    Math.random() * 96 +
    "vw";

  sparkle.style.animationDuration =
    2.5 +
    Math.random() * 2 +
    "s";

  sparkle.style.animationDelay =
    Math.random() * .3 +
    "s";

  effects.appendChild(sparkle);

  setTimeout(() => {
    sparkle.remove();
  }, 5200);
}


/* CELEBRATION */

function celebrate() {

  for (
    let i = 0;
    i < 55;
    i++
  ) {

    setTimeout(() => {
      makeConfetti();
    }, i * 25);

  }


  for (
    let i = 0;
    i < 12;
    i++
  ) {

    setTimeout(() => {
      makeSparkle();
    }, i * 100);

  }


  const message =
    document.getElementById(
      "buildMessage"
    );

  message.classList.remove(
    "show"
  );

  void message.offsetWidth;

  message.classList.add(
    "show"
  );

}


/* START CARD */

function startCard() {

  document
    .getElementById("intro")
    .classList.add("hide");

  setTimeout(() => {
    celebrate();
  }, 350);

}

</script>

</body>
</html>
