<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 17th Birthday, Emmitt!</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #08111f;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
  color: white;
}

/* =========================
   MAIN ARTWORK
========================= */

.hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;

  background:
    radial-gradient(circle at top, #173761, #07111f 70%);
}

.hero-image {
  width: 100%;
  max-width: 1100px;
  height: auto;
  display: block;

  box-shadow:
    0 0 45px rgba(0,0,0,.45);

  opacity: 0;
  transform: scale(.97);
  transition:
    opacity 1s ease,
    transform 1.2s ease;
}

.hero-image.reveal {
  opacity: 1;
  transform: scale(1);
}

/* =========================
   OPENING SCREEN
========================= */

.intro {
  position: fixed;
  inset: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 24px;

  background:
    radial-gradient(circle at 50% 35%, #1887ef 0%, #075abf 45%, #042857 100%);

  transition:
    opacity .7s ease,
    visibility .7s ease;
}

.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.intro-card {
  width: min(92vw, 560px);
  text-align: center;
}

.intro-brick {
  width: 90px;
  height: 52px;
  margin: 0 auto 28px;

  position: relative;

  background: #e72b31;

  border: 5px solid #111;
  border-radius: 7px;

  box-shadow:
    inset -8px -8px 0 rgba(0,0,0,.14),
    0 8px 0 #111;
}

.intro-brick::before {
  content: "";

  position: absolute;

  width: 26px;
  height: 13px;

  top: -14px;
  left: 10px;

  border: 4px solid #111;
  border-radius: 50%;

  background: #f4474c;

  box-shadow:
    36px 0 0 #f4474c;
}

.intro h1 {
  margin: 0;

  font-size: clamp(48px, 11vw, 95px);
  line-height: .9;
  letter-spacing: -3px;

  text-transform: uppercase;

  text-shadow:
    4px 4px 0 #111,
    8px 8px 0 rgba(0,0,0,.2);
}

.intro h1 span {
  color: #ffd51b;
}

.level {
  display: inline-block;

  margin-top: 24px;
  padding: 11px 18px;

  background: #ffd51b;
  color: #111;

  border: 4px solid #111;
  border-radius: 12px;

  font-size: clamp(16px, 4vw, 22px);
  font-weight: 900;

  box-shadow: 5px 5px 0 #111;
}

.tap-btn {
  display: block;

  margin: 35px auto 0;
  padding: 17px 29px;

  border: 5px solid #111;
  border-radius: 16px;

  background:
    linear-gradient(#ed3d42, #c71d25);

  color: white;

  font-size: clamp(17px, 4vw, 22px);
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 7px 0 #111,
    0 14px 25px rgba(0,0,0,.25);
}

.tap-btn:hover {
  transform: translateY(-3px);
}

.tap-btn:active {
  transform: translateY(4px);
}

/* =========================
   COUNTDOWN SCREEN
========================= */

.countdown-screen {
  position: fixed;
  inset: 0;

  z-index: 80;

  display: flex;
  justify-content: center;
  align-items: center;

  pointer-events: none;

  background:
    radial-gradient(circle at center,
      rgba(15,88,177,.78),
      rgba(2,20,47,.92));

  opacity: 0;

  transition: opacity .35s ease;
}

.countdown-screen.active {
  opacity: 1;
}

.countdown-number {
  font-size: clamp(100px, 30vw, 260px);

  font-weight: 1000;

  color: #ffd51b;

  text-shadow:
    6px 6px 0 #111,
    10px 10px 0 rgba(0,0,0,.25);

  opacity: 0;

  transform:
    scale(.45)
    rotate(-8deg);
}

.countdown-number.show {
  animation:
    countdownPop .9s ease forwards;
}

@keyframes countdownPop {

  0% {
    opacity: 0;

    transform:
      scale(.4)
      rotate(-7deg);
  }

  18% {
    opacity: 1;

    transform:
      scale(1.12)
      rotate(2deg);
  }

  65% {
    opacity: 1;

    transform:
      scale(1);
  }

  100% {
    opacity: 0;

    transform:
      scale(.9);
  }

}

/* =========================
   EFFECTS
========================= */

#effects {
  position: fixed;
  inset: 0;

  z-index: 50;

  overflow: hidden;
  pointer-events: none;
}

/* CONFETTI */

.confetti {
  position: absolute;

  top: -30px;

  width: 8px;
  height: 18px;

  border-radius: 2px;

  animation:
    confettiFall linear forwards;
}

@keyframes confettiFall {

  from {
    transform:
      translateY(-40px)
      rotate(0deg);

    opacity: 1;
  }

  to {
    transform:
      translateY(105vh)
      rotate(720deg);

    opacity: .8;
  }

}

/* SPARKLES */

.sparkle {
  position: absolute;

  top: -40px;

  font-size: 20px;

  animation:
    sparkleFall linear forwards;
}

@keyframes sparkleFall {

  from {
    transform:
      translateY(-40px)
      scale(.6)
      rotate(0deg);

    opacity: 1;
  }

  to {
    transform:
      translateY(100vh)
      scale(1.2)
      rotate(450deg);

    opacity: .2;
  }

}

/* =========================
   BIRTHDAY MESSAGE
========================= */

.birthday-message {
  position: fixed;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    scale(.6);

  z-index: 70;

  width: min(88vw, 680px);

  padding: 22px 26px;

  border: 5px solid #111;
  border-radius: 18px;

  background:
    linear-gradient(#ffd92a, #efb900);

  color: #111;

  text-align: center;

  font-size: clamp(28px, 7vw, 58px);
  line-height: 1.05;
  font-weight: 1000;

  box-shadow:
    9px 9px 0 #111;

  opacity: 0;

  pointer-events: none;
}

.birthday-message.show {
  animation:
    birthdayPop 2s ease forwards;
}

@keyframes birthdayPop {

  0% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(.5)
      rotate(-4deg);
  }

  15% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1.06)
      rotate(1deg);
  }

  65% {
    opacity: 1;

    transform:
      translate(-50%, -50%)
      scale(1);
  }

  100% {
    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(.95);
  }

}

/* =========================
   REPLAY BUTTON
========================= */

.replay-btn {
  position: fixed;

  left: 50%;
  bottom: 18px;

  transform: translateX(-50%);

  z-index: 30;

  padding: 14px 24px;

  border: 4px solid #111;
  border-radius: 18px;

  background:
    linear-gradient(#2085f0, #0759c8);

  color: white;

  font-size: 16px;
  font-weight: 900;

  cursor: pointer;

  box-shadow:
    0 7px 0 #111,
    0 12px 25px rgba(0,0,0,.38);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .5s ease;
}

.replay-btn.show {
  opacity: 1;
  pointer-events: auto;
}

.replay-btn:hover {
  transform:
    translateX(-50%)
    translateY(-3px);
}

.replay-btn:active {
  transform:
    translateX(-50%)
    translateY(4px);

  box-shadow:
    0 2px 0 #111;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  .replay-btn {
    bottom: 12px;

    font-size: 14px;

    padding: 11px 17px;
  }

}
</style>
</head>

<body>

<!-- AUDIO -->

<audio
  id="birthdayAudio"
  preload="auto"
>
  <source
    src="birthday-countdown.m4a"
    type="audio/mp4"
  >
</audio>


<!-- OPENING -->

<div
  class="intro"
  id="intro"
>

  <div class="intro-card">

    <div class="intro-brick"></div>

    <h1>
      EMMITT'S
      <br>
      <span>17TH</span>
    </h1>

    <div class="level">
      🏆 MASTER BUILDER LEVEL 17
    </div>

    <button
      class="tap-btn"
      onclick="startExperience()"
    >
      🔊 TAP TO BUILD
    </button>

  </div>

</div>


<!-- COUNTDOWN -->

<div
  class="countdown-screen"
  id="countdownScreen"
>

  <div
    class="countdown-number"
    id="countdownNumber"
  ></div>

</div>


<!-- EFFECTS -->

<div id="effects"></div>


<!-- BIRTHDAY MESSAGE -->

<div
  class="birthday-message"
  id="birthdayMessage"
>
  🎉 HAPPY 17TH BIRTHDAY,
  <br>
  EMMITT! 🎉
</div>


<!-- MAIN ARTWORK -->

<main class="hero">

  <img
    src="emmitt-birthday-hero.png"
    alt="Happy 17th Birthday Emmitt"
    class="hero-image"
    id="heroImage"
  >

</main>


<!-- REPLAY -->

<button
  class="replay-btn"
  id="replayButton"
  onclick="replayExperience()"
>
  🔊 PLAY AGAIN
</button>


<script>

const colors = [
  "#e72b31",
  "#ffd51b",
  "#086dd7",
  "#159549",
  "#f28a20",
  "#ffffff"
];

let timers = [];


/* =========================
   TIMER CONTROL
========================= */

function clearTimers() {

  timers.forEach(timer => {

    clearTimeout(timer);

  });

  timers = [];

}


/* =========================
   COUNTDOWN DISPLAY
========================= */

function showCount(number) {

  const el =
    document.getElementById(
      "countdownNumber"
    );

  el.textContent =
    number;

  el.classList.remove(
    "show"
  );

  void el.offsetWidth;

  el.classList.add(
    "show"
  );

}


/* =========================
   CONFETTI
========================= */

function makeConfetti() {

  const effects =
    document.getElementById(
      "effects"
    );

  const piece =
    document.createElement(
      "div"
    );

  piece.className =
    "confetti";

  piece.style.left =
    Math.random() * 100 +
    "vw";

  piece.style.background =
    colors[
      Math.floor(
        Math.random() *
        colors.length
      )
    ];

  piece.style.animationDuration =
    2.2 +
    Math.random() * 2 +
    "s";

  piece.style.animationDelay =
    Math.random() * .25 +
    "s";

  effects.appendChild(
    piece
  );

  setTimeout(() => {

    piece.remove();

  }, 5000);

}


/* =========================
   SPARKLES
========================= */

function makeSparkle() {

  const effects =
    document.getElementById(
      "effects"
    );

  const sparkle =
    document.createElement(
      "div"
    );

  sparkle.className =
    "sparkle";

  sparkle.textContent =
    Math.random() > .5
      ? "✨"
      : "⭐";

  sparkle.style.left =
    Math.random() * 96 +
    "vw";

  sparkle.style.animationDuration =
    2.5 +
    Math.random() * 2 +
    "s";

  sparkle.style.animationDelay =
    Math.random() * .3 +
    "s";

  effects.appendChild(
    sparkle
  );

  setTimeout(() => {

    sparkle.remove();

  }, 5200);

}


/* =========================
   CELEBRATION
========================= */

function celebrate() {

  const hero =
    document.getElementById(
      "heroImage"
    );

  hero.classList.add(
    "reveal"
  );


  const message =
    document.getElementById(
      "birthdayMessage"
    );

  message.classList.remove(
    "show"
  );

  void message.offsetWidth;

  message.classList.add(
    "show"
  );


  for (
    let i = 0;
    i < 65;
    i++
  ) {

    setTimeout(() => {

      makeConfetti();

    }, i * 22);

  }


  for (
    let i = 0;
    i < 16;
    i++
  ) {

    setTimeout(() => {

      makeSparkle();

    }, i * 80);

  }


  timers.push(

    setTimeout(() => {

      document
        .getElementById(
          "replayButton"
        )
        .classList.add(
          "show"
        );

    }, 2200)

  );

}


/* =========================
   COUNTDOWN
========================= */

function runCountdownSequence() {

  const screen =
    document.getElementById(
      "countdownScreen"
    );

  screen.classList.add(
    "active"
  );


  /*
    Timed to the uploaded audio.
  */

  const countdown = [

    { number: "10", time: 1450 },
    { number: "9",  time: 2450 },
    { number: "8",  time: 3550 },
    { number: "7",  time: 4650 },
    { number: "6",  time: 5750 },
    { number: "5",  time: 6700 },
    { number: "4",  time: 7650 },
    { number: "3",  time: 8600 },
    { number: "2",  time: 9650 },
    { number: "1",  time: 10650 }

  ];


  countdown.forEach(item => {

    timers.push(

      setTimeout(() => {

        showCount(
          item.number
        );

      }, item.time)

    );

  });


  /*
    Hide countdown just before
    birthday song reveal.
  */

  timers.push(

    setTimeout(() => {

      screen.classList.remove(
        "active"
      );

    }, 11750)

  );


  /*
    Birthday-song hit.
  */

  timers.push(

    setTimeout(() => {

      celebrate();

    }, 12350)

  );

}


/* =========================
   AUDIO
========================= */

function startAudio() {

  const audio =
    document.getElementById(
      "birthdayAudio"
    );

  audio.pause();

  audio.currentTime = 0;

  audio.play().catch(error => {

    console.log(
      "Audio could not start:",
      error
    );

  });

}


/* =========================
   START
========================= */

function startExperience() {

  clearTimers();

  document
    .getElementById(
      "intro"
    )
    .classList.add(
      "hide"
    );

  document
    .getElementById(
      "replayButton"
    )
    .classList.remove(
      "show"
    );

  startAudio();

  runCountdownSequence();

}


/* =========================
   REPLAY
========================= */

function replayExperience() {

  clearTimers();


  const hero =
    document.getElementById(
      "heroImage"
    );

  hero.classList.remove(
    "reveal"
  );


  document
    .getElementById(
      "replayButton"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "birthdayMessage"
    )
    .classList.remove(
      "show"
    );


  startAudio();

  runCountdownSequence();

}

</script>

</body>
</html>
